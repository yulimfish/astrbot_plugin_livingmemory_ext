<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日记发送目标</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --border: #e0e0e6;
      --text: #1f1f23;
      --muted: #6e6e78;
      --primary: #3f6ef6;
      --primary-hover: #3159d4;
      --danger: #e5484d;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }
    header h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    header p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .rule-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .rule-card.disabled { opacity: 0.55; }
    .rule-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .rule-title .name {
      font-weight: 600;
      font-size: 15px;
    }
    .rule-title .meta { color: var(--muted); font-size: 12px; }
    .field-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .search-box {
      position: relative;
      margin-bottom: 8px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--primary); }
    .dropdown {
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown .option {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid #f1f1f4;
    }
    .dropdown .option:last-child { border-bottom: none; }
    .dropdown .option:hover { background: #f0f4ff; }
    .dropdown .option .gid { color: var(--muted); font-size: 12px; margin-left: 6px; }
    .dropdown .empty {
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .selected {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0f4ff;
      border: 1px solid #c9d6fb;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      margin-top: 8px;
    }
    .selected .tag { color: var(--primary); }
    .status {
      font-size: 13px;
      min-height: 20px;
      margin-top: 8px;
    }
    .status.ok { color: #22863a; }
    .status.err { color: var(--danger); }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #eef0f4;
      color: var(--text);
    }
    .btn-secondary:hover { background: #e2e5ec; }
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
    .loading {
      text-align: center;
      color: var(--muted);
      padding: 32px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>日记发送目标</h1>
      <p>为每条日记发送规则选择发送位置。下拉框会自动获取当前所有平台的群聊，支持输入群名 / 群号过滤。</p>
    </header>
    <div id="app">
      <div class="loading">加载中…</div>
    </div>
  </div>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script>
    (function () {
      const app = document.getElementById("app");
      const plugin = window.AstrBotPluginPage;
      let groups = [];
      let rules = [];

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function render() {
        if (!rules.length) {
          app.innerHTML = "";
          const box = el("div", "empty-state");
          box.textContent = "暂无可配置的日记规则，请先在插件配置中开启记忆日记并添加规则。";
          app.appendChild(box);
          return;
        }
        app.innerHTML = "";
        rules.forEach((rule) => {
          app.appendChild(buildRuleCard(rule));
        });
      }

      function buildRuleCard(rule) {
        const card = el("div", "rule-card" + (rule.enabled === false ? " disabled" : ""));
        const title = el("div", "rule-title");
        const name = el("span", "name", rule.name || "未命名规则");
        const meta = el(
          "span",
          "meta",
          "当前：" + (rule.send_to ? rule.platform + " / " + rule.send_to : "未设置")
        );
        title.appendChild(name);
        title.appendChild(meta);
        card.appendChild(title);

        const label = el("label", "field-label", "发送目标（支持搜索群名/群号）");
        card.appendChild(label);

        const box = el("div", "search-box");
        const input = el("input");
        input.type = "text";
        input.placeholder = "输入群名或群号过滤…";
        box.appendChild(input);
        card.appendChild(box);

        const dropdown = el("div", "dropdown");
        card.appendChild(dropdown);

        const selected = el("div", "selected");
        selected.style.display = "none";
        card.appendChild(selected);

        const status = el("div", "status");
        card.appendChild(status);

        const saveBtn = el("button", "btn", "保存到规则");
        saveBtn.type = "button";
        card.appendChild(saveBtn);

        let picked = null;

        function filterGroups(keyword) {
          const kw = (keyword || "").trim().toLowerCase();
          if (!kw) return groups;
          return groups.filter(
            (g) =>
              g.group_name.toLowerCase().includes(kw) ||
              g.group_id.toLowerCase().includes(kw)
          );
        }

        function renderOptions() {
          dropdown.innerHTML = "";
          const list = filterGroups(input.value);
          if (!list.length) {
            const empty = el("div", "empty", "没有匹配的群聊");
            dropdown.appendChild(empty);
          } else {
            list.forEach((g) => {
              const opt = el("div", "option", g.group_name || "(无名称)");
              const gid = el("span", "gid", g.group_id);
              opt.appendChild(gid);
              opt.addEventListener("click", () => {
                picked = g;
                showPicked();
                dropdown.classList.remove("open");
              });
              dropdown.appendChild(opt);
            });
          }
        }

        function showPicked() {
          if (!picked) return;
          selected.style.display = "flex";
          selected.innerHTML = "";
          const text = el(
            "span",
            "",
            (picked.group_name || "(无名称)") + " · " + picked.group_id
          );
          const tag = el("span", "tag", picked.platform_id);
          selected.appendChild(text);
          selected.appendChild(tag);
          status.className = "status";
          status.textContent = "";
        }

        input.addEventListener("focus", () => {
          renderOptions();
          dropdown.classList.add("open");
        });
        input.addEventListener("input", () => {
          renderOptions();
          dropdown.classList.add("open");
        });
        input.addEventListener("blur", () => {
          setTimeout(() => dropdown.classList.remove("open"), 150);
        });

        saveBtn.addEventListener("click", async () => {
          if (!picked) {
            status.className = "status err";
            status.textContent = "请先选择发送目标。";
            return;
          }
          saveBtn.disabled = true;
          saveBtn.textContent = "保存中…";
          try {
            const res = await plugin.apiPost("save_diary_target", {
              rule_index: rule.index,
              platform_id: picked.platform_id,
              group_id: picked.group_id,
            });
            if (res && res.status === "ok") {
              status.className = "status ok";
              status.textContent = "已保存 ✓ " + picked.platform_id + ":GroupMessage:" + picked.group_id;
              meta.textContent = "当前：" + picked.platform_id + " / " + picked.group_id;
            } else {
              status.className = "status err";
              status.textContent = (res && res.message) || "保存失败";
            }
          } catch (e) {
            status.className = "status err";
            status.textContent = "保存失败：" + (e && e.message ? e.message : e);
          } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "保存到规则";
          }
        });

        return card;
      }

      async function load() {
        try {
          const [groupsRes, rulesRes] = await Promise.all([
            plugin.apiGet("groups"),
            plugin.apiGet("diary_rules"),
          ]);
          groups = (groupsRes && groupsRes.data) || [];
          rules = (rulesRes && rulesRes.data) || [];
          render();
        } catch (e) {
          app.innerHTML = "";
          const box = el("div", "empty-state");
          box.textContent = "加载失败：" + (e && e.message ? e.message : e);
          app.appendChild(box);
        }
      }

      plugin.ready().then(load).catch((e) => {
        app.innerHTML = "";
        const box = el("div", "empty-state");
        box.textContent = "初始化失败：" + (e && e.message ? e.message : e);
        app.appendChild(box);
      });
    })();
  </script>
</body>
</html>
